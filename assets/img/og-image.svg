<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#101b33"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#3b6ef5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3b6ef5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5d489"/>
      <stop offset="1" stop-color="#d9a233"/>
    </linearGradient>
    <clipPath id="bandeira">
      <rect x="84" y="196" width="132" height="88" rx="10"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1">
    <path d="M0 120h1200M0 240h1200M0 360h1200M0 480h1200"/>
    <path d="M120 0v630M360 0v630M600 0v630M840 0v630M1080 0v630"/>
  </g>

  <!-- Bandeira da França -->
  <g clip-path="url(#bandeira)">
    <rect x="84" y="196" width="44" height="88" fill="#0b3d91"/>
    <rect x="128" y="196" width="44" height="88" fill="#f5f7fb"/>
    <rect x="172" y="196" width="44" height="88" fill="#e63946"/>
  </g>
  <rect x="84" y="196" width="132" height="88" rx="10" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2"/>

  <text x="250" y="258" fill="#e9eef7" font-family="Outfit, Segoe UI, sans-serif" font-size="74" font-weight="800" letter-spacing="6">FRANÇA</text>
  <text x="252" y="316" fill="url(#gold)" font-family="Outfit, Segoe UI, sans-serif" font-size="30" font-weight="700" letter-spacing="12">COMUNIDADE AO VIVO</text>

  <text x="84" y="430" fill="#97a3b8" font-family="Inter, Segoe UI, sans-serif" font-size="30">Quem está ao vivo na Kick e na Twitch, em um só lugar.</text>

  <rect x="84" y="480" width="248" height="58" rx="29" fill="url(#gold)"/>
  <text x="208" y="517" text-anchor="middle" fill="#10140f" font-family="Outfit, Segoe UI, sans-serif" font-size="20" font-weight="700">VER QUEM ESTÁ AO VIVO</text>
</svg>
