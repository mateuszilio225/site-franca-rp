name: Atualizar status das lives

on:
  schedule:
    # A cada 5 minutos (o GitHub pode atrasar alguns minutos em horário de pico).
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/streamers.json"
      - "scripts/update-live.mjs"
      - ".github/workflows/live.yml"

permissions:
  contents: write

concurrency:
  group: status-lives
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Consultar Kick e Twitch
        run: node scripts/update-live.mjs
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}

      - name: Salvar data/live.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ -z "$(git status --porcelain data/live.json)" ]]; then
            echo "Nenhuma mudança no status."
            exit 0
          fi

          # O status é sempre "o mais recente vence": sincroniza com a main e
          # cria o commit em cima dela, sem merge/rebase (evita conflito quando
          # duas execuções se cruzam).
          for tentativa in 1 2 3; do
            git fetch --quiet origin main
            git reset --soft origin/main
            git add data/live.json
            git commit -m "chore: atualiza status das lives" || true

            if git push --quiet origin HEAD:main; then
              echo "Status publicado (tentativa $tentativa)."
              exit 0
            fi

            echo "Push recusado, tentando novamente em 5s..."
            sleep 5
          done

          echo "Não foi possível publicar o status desta vez."
          exit 1
